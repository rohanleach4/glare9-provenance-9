name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - run: npm ci
      - run: npm run scan:repository
      - run: npm run audit:dependencies
      - run: npm run fuzz
      - uses: github/codeql-action/analyze@v4
        with:
          # Private source development does not include GitHub Code Security.
          # Analysis still runs locally; publication begins automatically when public.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          # CodeQL otherwise attempts a separate database upload even when SARIF
          # publication is disabled, producing noisy retries against private repos.
          upload-database: ${{ !github.event.repository.private }}
