name: Bug report
description: Report reproducible incorrect behavior without secrets or customer evidence.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities, credentials, private keys, customer content or production evidence here; follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include redacted error codes and a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node/npm versions, custody profile and relevant connector without confidential values.
    validations:
      required: true
